---
- name: zabbix server + agent
  hosts: all
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive

  vars:
    tls_dir: /etc/zabbix/ssl
    tls_ca_subject: "/CN=Zabbix CA"
    tls_server_subject: "/CN=Zabbix Server"
    tls_agent_subject: "/CN=Zabbix Agent"
    tls_cert_days: 3650

  tasks:
    - name: Remove existing zabbix-release package to avoid version conflicts
      ansible.builtin.apt:
        name: zabbix-release
        state: absent
      ignore_errors: true
      
    - name: add zabbix repo
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/7.4/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.4+ubuntu24.04_all.deb

    - name: update apt cache after adding zabbix repo
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: install and upgrade all packages
      ansible.builtin.apt:
        name:
          - mysql-server
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent
          - openssl
          - apache2
          - php8.3-fpm
          - php8.3-mysql
          - php8.3-mbstring
          - php8.3-bcmath
          - php8.3-xml
          - php8.3-gd
          - php8.3-ldap
          - php8.3-curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: enable php modules for fpm
      ansible.builtin.command: phpenmod -v 8.3 -s fpm {{ item }}
      loop: [mysql, mysqli, pdo_mysql, mbstring, bcmath, xml, gd, ldap, curl]
      register: phpenmod_result
      changed_when: "'already enabled' not in phpenmod_result.stderr"
      failed_when: false
      notify: restart php-fpm

    - name: switch apache to PHP-FPM
      ansible.builtin.shell: |
        a2dismod mpm_event mpm_worker php8.3 2>/dev/null || true
        a2enmod mpm_prefork proxy proxy_http proxy_fcgi setenvif
        a2enconf php8.3-fpm
      register: php_fpm_setup
      changed_when: "'Enabling' in php_fpm_setup.stdout or 'Disabling' in php_fpm_setup.stdout"
      failed_when: false
      notify: restart apache2

    - name: ensure php-fpm service is running
      ansible.builtin.service:
        name: php8.3-fpm
        state: started
        enabled: true

    # DB---------------------------------------------------------------------------------
    - name: start mysql
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: create zabbix db and db_user
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "ALTER USER 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
        mysql -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      changed_when: false
      no_log: true

    - name: check zabbix db mandatory version
      ansible.builtin.shell: |
        mysql -uzabbix -p'{{ zabbix_db_password }}' -N -B \
          -e "SELECT mandatory FROM zabbix.dbversion LIMIT 1;"
      register: db_version
      changed_when: false
      failed_when: false
      no_log: true

    - name: drop zabbix db if version mismatch
      ansible.builtin.shell: |
        mysql -e "DROP DATABASE IF EXISTS zabbix; CREATE DATABASE zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
      changed_when: true
      no_log: true
      when: db_version.stdout is defined and db_version.stdout | trim != '7040000' and db_version.rc == 0

    - name: check if zabbix schema is imported
      ansible.builtin.shell: |
        mysql -uzabbix -p'{{ zabbix_db_password }}' -N -B \
          -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix' AND table_name='dbversion';"
      register: schema_check
      changed_when: false
      no_log: true

    - name: find zabbix mysql schema file
      ansible.builtin.find:
        paths: /usr/share
        patterns: "server.sql.gz"
        recurse: yes
      register: zabbix_sql_script
      when: schema_check.stdout | trim != '1'

    - name: set schema file path
      ansible.builtin.set_fact:
        zabbix_schema_file: "{{ zabbix_sql_script.files | map(attribute='path') | select('search', '/mysql/') | list | first }}"
      when: schema_check.stdout | trim != '1'

    - name: import zabbix schema
      ansible.builtin.shell: |
        set -o pipefail
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | \
        mysql --default-character-set=utf8mb4 -uzabbix -p'{{ zabbix_db_password }}' zabbix
      args:
        executable: /bin/bash
      when: schema_check.stdout | trim != '1'

    # TLS: CA-------------------------------------------------------------------
    - name: create tls directory
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        owner: zabbix
        group: zabbix
        mode: "0750"

    - name: generate CA private key
      ansible.builtin.shell:
        cmd: openssl genrsa -out "{{ tls_dir }}/ca.key" 4096
        creates: "{{ tls_dir }}/ca.key"

    - name: generate CA certificate
      ansible.builtin.shell:
        cmd: >-
          openssl req -x509 -new -nodes
          -key "{{ tls_dir }}/ca.key"
          -sha256 -days {{ tls_cert_days }}
          -out "{{ tls_dir }}/ca.crt"
          -subj "{{ tls_ca_subject }}"
        creates: "{{ tls_dir }}/ca.crt"

    # TLS_____------------------------------------------------------------------------
    - name: generate component keys and certificates
      block:
        - name: generate private keys
          ansible.builtin.shell:
            cmd: "openssl genrsa -out '{{ tls_dir }}/{{ item }}.key' 4096"
            creates: "{{ tls_dir }}/{{ item }}.key"
          loop: [server, agent]

        - name: generate CSRs
          ansible.builtin.shell:
            cmd: >-
              openssl req -new
              -key "{{ tls_dir }}/{{ item.name }}.key"
              -out "{{ tls_dir }}/{{ item.name }}.csr"
              -subj "{{ item.subject }}"
            creates: "{{ tls_dir }}/{{ item.name }}.csr"
          loop:
            - { name: server, subject: "{{ tls_server_subject }}" }
            - { name: agent, subject: "{{ tls_agent_subject }}" }

        - name: sign certificates with CA
          ansible.builtin.shell:
            cmd: >-
              openssl x509 -req
              -in "{{ tls_dir }}/{{ item }}.csr"
              -CA "{{ tls_dir }}/ca.crt"
              -CAkey "{{ tls_dir }}/ca.key"
              -CAcreateserial
              -out "{{ tls_dir }}/{{ item }}.crt"
              -days {{ tls_cert_days }}
              -sha256
            creates: "{{ tls_dir }}/{{ item }}.crt"
          loop: [server, agent]

    # TLS: permissions-------------------------------------------------------
    - name: set permissions on private keys
      ansible.builtin.file:
        path: "{{ item }}"
        owner: zabbix
        group: zabbix
        mode: "0600"
      loop:
        - "{{ tls_dir }}/ca.key"
        - "{{ tls_dir }}/server.key"
        - "{{ tls_dir }}/agent.key"

    - name: set permissions on certificates
      ansible.builtin.file:
        path: "{{ item }}"
        owner: zabbix
        group: zabbix
        mode: "0644"
      loop:
        - "{{ tls_dir }}/ca.crt"
        - "{{ tls_dir }}/server.crt"
        - "{{ tls_dir }}/agent.crt"

    # Frontend---------------------------------------------------------------------
    - name: preseed zabbix frontend config
      ansible.builtin.copy:
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          $DB['TYPE']     = 'MYSQL';
          $DB['SERVER']   = 'localhost';
          $DB['PORT']     = '0';
          $DB['DATABASE'] = 'zabbix';
          $DB['USER']     = 'zabbix';
          $DB['PASSWORD'] = '{{ zabbix_db_password }}';
          $DB['SCHEMA']   = '';
          $DB['ENCRYPTION'] = false;
          $DB['KEY_FILE'] = '';
          $DB['CERT_FILE'] = '';
          $DB['CA_FILE'] = '';
          $DB['VERIFY_HOST'] = false;
          $DB['CIPHER_LIST'] = '';
          $ZBX_SERVER      = 'localhost';
          $ZBX_SERVER_PORT = '10051';
          $ZBX_SERVER_NAME = '';
          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      no_log: true

    - name: point apache to new frontend path
      ansible.builtin.replace:
        path: /etc/apache2/conf-available/zabbix.conf
        regexp: '/usr/share/zabbix(?!/ui)'
        replace: '/usr/share/zabbix/ui'
      notify: restart apache2

    # Server config--------------------------------------------------------------------
    - name: set zabbix DBName
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBName='
        line: 'DBName=zabbix'

    - name: set zabbix DBUser
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBUser='
        line: 'DBUser=zabbix'

    - name: set zabbix DBPassword
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: 'DBPassword={{ zabbix_db_password }}'

    - name: configure zabbix server TLS settings
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: 'TLSCAFile', value: '{{ tls_dir }}/ca.crt' }
        - { key: 'TLSCertFile', value: '{{ tls_dir }}/server.crt' }
        - { key: 'TLSKeyFile', value: '{{ tls_dir }}/server.key' }
      notify: restart zabbix-server

    # Agent config---------------------------------------------------------------------------
    - name: zabbix agent config with TLS certificates
      ansible.builtin.replace:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '{{ item.regexp }}'
        replace: '{{ item.replace }}'
      loop:
        - { regexp: '^#\s*Server=.*',         replace: 'Server={{ zabbix_server_ip | default("127.0.0.1") }}' }
        - { regexp: '^#\s*ServerActive=.*',   replace: 'ServerActive={{ zabbix_server_ip | default("127.0.0.1") }}' }
        - { regexp: '^#\s*Hostname=.*',       replace: 'Hostname={{ ansible_facts["hostname"] }}' }
        - { regexp: '^#\s*TLSConnect=.*',     replace: 'TLSConnect=cert' }
        - { regexp: '^#\s*TLSAccept=.*',      replace: 'TLSAccept=cert' }
        - { regexp: '^#\s*TLSCAFile=.*',      replace: 'TLSCAFile={{ tls_dir }}/ca.crt' }
        - { regexp: '^#\s*TLSCertFile=.*',    replace: 'TLSCertFile={{ tls_dir }}/agent.crt' }
        - { regexp: '^#\s*TLSKeyFile=.*',     replace: 'TLSKeyFile={{ tls_dir }}/agent.key' }
      notify: restart zabbix-agent

    # Start services-----------------------------------------------------------------
    - name: start and verify services
      block:
        - name: start zabbix-server
          ansible.builtin.service:
            name: zabbix-server
            state: started
            enabled: true

        - name: start other services
          ansible.builtin.service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop: [zabbix-agent, apache2]

        - name: wait for zabbix-server to become active
          ansible.builtin.command: systemctl is-active zabbix-server
          register: zbx_status
          changed_when: false
          until: zbx_status.stdout == 'active'
          retries: 12
          delay: 10
      rescue:
        - name: dump journalctl and zabbix log
          ansible.builtin.shell: |
            echo "JOURNALCTL"
            journalctl -u zabbix-server -n 30 --no-pager 2>&1
            echo "ZABBIX LOG"
            tail -n 50 /var/log/zabbix/zabbix_server.log 2>&1
          register: zbx_debug_log
          changed_when: false
          failed_when: false

    # =========================================================================
    
    - name: Login to Zabbix API to get temporary token
      ansible.builtin.uri:
        url: "http://127.0.0.1/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json-rpc"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "user.login"
          params:
            user: "Admin"
            password: "{{ zabbix_admin_password | default('zabbix') }}"
          id: 1
      register: zabbix_login
      delegate_to: 127.0.0.1
      run_once: true
      no_log: true

    - name: Create Host in Zabbix with TLS Certificate encryption enabled
      ansible.builtin.uri:
        url: "http://127.0.0.1/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Content-Type: "application/json-rpc"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "host.create"
          params:
            host: "{{ ansible_facts['hostname'] }}"
            interfaces:
              - type: 1
                main: 1
                useip: 1
                ip: "{{ ansible_host }}"
                dns: ""
                port: "10050"
            tls_connect: 4    
            tls_accept: 4       
            tls_issuer: "Zabbix CA"
            tls_subject: "Zabbix Agent"
          auth: "{{ zabbix_login.json.result }}"
          id: 2
      register: zabbix_host_create
      delegate_to: 127.0.0.1
      run_once: true
      no_log: true
      failed_when: 
        - zabbix_host_create.json.error is defined 
        - zabbix_host_create.json.error.code != -32602

  handlers:
    - name: restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: restart zabbix-server
      ansible.builtin.service:
        name: zabbix-server
        state: restarted

    - name: restart zabbix-agent
      ansible.builtin.service:
        name: zabbix-agent
        state: restarted

    - name: restart php-fpm
      ansible.builtin.service:
        name: php8.3-fpm
        state: restarted

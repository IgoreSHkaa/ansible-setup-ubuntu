---
- name: zabbix server + agent + fail2ban
  hosts: all
  become: true

  vars:
    psk_id: "zabbixPSK"

  tasks:

    - name: generate psk key if not provided
      ansible.builtin.set_fact:
        psk_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') }}"
      when: psk_key is not defined or psk_key | length == 0
      run_once: true

    - name: debug psk key (remove after testing)
      ansible.builtin.debug:
        msg: "Generated PSK key: {{ psk_key }}"
  
    - name: add zabbix repo
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/7.4/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.4+ubuntu24.04_all.deb

    - name: install AND upgrade all packages to repo versions 
      ansible.builtin.apt:
        name:
          - mariadb-server
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent
          - fail2ban
        state: latest
        update_cache: true

    - name: start mariadb
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: stop zabbix-server during db maintenance
      ansible.builtin.service:
        name: zabbix-server
        state: stopped
      failed_when: false

    - name: create zabbix db and db_user
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "ALTER USER 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
        mysql -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      changed_when: false
      no_log: true

    - name: check if zabbix schema is imported
      ansible.builtin.shell: |
        mysql -uzabbix -p'{{ zabbix_db_password }}' -N -B \
          -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix' AND table_name='dbversion';"
      register: schema_check
      changed_when: false
      no_log: true

    - name: find zabbix mysql schema file
      ansible.builtin.find:
        paths: /usr/share
        patterns: "server.sql.gz"
        recurse: yes
      register: zabbix_sql_script

    - name: set schema file path (mysql only)
      ansible.builtin.set_fact:
        zabbix_schema_file: "{{ zabbix_sql_script.files | map(attribute='path') | select('search', '/mysql/') | list | first }}"

    - name: import zabbix schema
      ansible.builtin.shell: |
        set -o pipefail
        mysql -e "DROP DATABASE IF EXISTS zabbix; CREATE DATABASE zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
        zcat "{{ zabbix_schema_file }}" | \
        mysql --default-character-set=utf8mb4 -uzabbix -p'{{ zabbix_db_password }}' zabbix
      args:
        executable: /bin/bash
      when: schema_check.stdout | trim != '1'

    - name: preseed zabbix frontend config
      ansible.builtin.copy:
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          $DB['TYPE']     = 'MYSQL';
          $DB['SERVER']   = 'localhost';
          $DB['PORT']     = '0';
          $DB['DATABASE'] = 'zabbix';
          $DB['USER']     = 'zabbix';
          $DB['PASSWORD'] = '{{ zabbix_db_password }}';
          $DB['SCHEMA']   = '';
          $DB['ENCRYPTION'] = false;
          $DB['KEY_FILE'] = '';
          $DB['CERT_FILE'] = '';
          $DB['CA_FILE'] = '';
          $DB['VERIFY_HOST'] = false;
          $DB['CIPHER_LIST'] = '';
          $ZBX_SERVER      = 'localhost';
          $ZBX_SERVER_PORT = '10051';
          $ZBX_SERVER_NAME = '';
          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      no_log: true

    - name: point apache to new frontend path 
      ansible.builtin.shell: |
        CONF=/etc/apache2/conf-available/zabbix.conf
        if grep -qP '/usr/share/zabbix(?!/ui)' "$CONF"; then
          sed -i -e 's|/usr/share/zabbix/ui|/usr/share/zabbix|g' \
                 -e 's|/usr/share/zabbix|/usr/share/zabbix/ui|g' "$CONF"
          echo changed
        fi
      register: apache_path_update
      changed_when: "'changed' in apache_path_update.stdout"
      notify: restart apache2

    - name: fail2ban config
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          backend = auto
          banaction = iptables-multiport
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          backend = polling
          maxretry = 5
          bantime = 1h
          findtime = 10m
      notify: restart f2b

    - name: psk file
      ansible.builtin.copy:
        dest: /etc/zabbix/agent.psk
        content: "{{ psk_key }}"
        owner: zabbix
        group: zabbix
        mode: "0600"

    - name: set zabbix DBName
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBName='
        line: 'DBName=zabbix'
      notify: restart zabbix-server

    - name: set zabbix DBUser
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBUser='
        line: 'DBUser=zabbix'
      notify: restart zabbix-server

    - name: set zabbix DBPassword
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: 'DBPassword={{ zabbix_db_password }}'
        insertafter: 'EOF'
      no_log: true
      notify: restart zabbix-server

    - name: set fact for TLS support (always true for official Zabbix packages)
      ansible.builtin.set_fact:
        zabbix_tls_supported: true

    - name: zabbix server tls config
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_server.d/tls.conf
        content: |
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
        owner: root
        group: zabbix
        mode: "0640"
      notify: restart zabbix-server
      when: zabbix_tls_supported | bool

    - name: zabbix agent config autoregistration
      ansible.builtin.blockinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        block: |
          Server={{ zabbix_server_ip | default('127.0.0.1') }}
          ServerActive={{ zabbix_server_ip | default('127.0.0.1') }}
          Hostname={{ ansible_facts['hostname'] }}
          HostMetadataItem=system.uname
          HostMetadata=ubuntu_zabbix_agent
          RefreshActiveChecks=120
          BufferSend=5
          BufferSize=100
          TLSConnect=psk
          TLSAccept=psk
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
      notify: restart zabbix-agent

    - name: start and verify services
      block:
        - name: start zabbix-server
          ansible.builtin.service:
            name: zabbix-server
            state: started
            enabled: true

      - name: start other services
        ansible.builtin.service:
          name: "{{ item }}"
          state: started
          enabled: true
        loop: [zabbix-agent, apache2, fail2ban]

        - name: wait for zabbix-server to become active
          ansible.builtin.command: systemctl is-active zabbix-server
          register: zbx_status
          changed_when: false
          until: zbx_status.stdout == 'active'
          retries: 12
          delay: 10
      rescue:
        - name: dump journalctl and zabbix log
          ansible.builtin.shell: |
            echo "=== JOURNALCTL ==="
            journalctl -u zabbix-server -n 30 --no-pager 2>&1
            echo "=== ZABBIX LOG ==="
            tail -n 50 /var/log/zabbix/zabbix_server.log 2>&1
          register: zbx_debug_log
          changed_when: false
          failed_when: false

        - name: fail with detailed log
          ansible.builtin.fail:
            msg: "Zabbix server не поднялся. Лог: \n{{ zbx_debug_log.stdout }}"

  handlers:
    - name: restart f2b
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: restart zabbix-server
      ansible.builtin.service:
        name: zabbix-server
        state: restarted

    - name: restart zabbix-agent
      ansible.builtin.service:
        name: zabbix-agent
        state: restarted

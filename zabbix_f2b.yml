---
- name: zabbix server + agent + fail2ban
  hosts: all
  become: true

  vars:
    tls_dir: /etc/zabbix/ssl

  tasks:
    - name: add zabbix repo
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/7.4/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.4+ubuntu24.04_all.deb

    - name: install ands upgrade all packages to repo versions 
      ansible.builtin.apt:
        name:
          - mysql-server
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent
          - fail2ban
          - openssl
          - apache2
          - libapache2-mod-php
          - php-mysql
          - php-mbstring
          - php-bcmath
          - php-xml
          - php-gd
          - php-ldap
          - php-curl
        state: latest
        update_cache: true

    - name: start mysql
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: create zabbix db and db_user
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "ALTER USER 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
        mysql -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      changed_when: false
      no_log: true

    - name: check zabbix db mandatory version 
      ansible.builtin.shell: |
        mysql -uzabbix -p'{{ zabbix_db_password }}' -N -B \
          -e "SELECT mandatory FROM zabbix.dbversion LIMIT 1;"
      register: db_version
      changed_when: false
      failed_when: false
      no_log: true

    - name: drop zabbix db if version mismatch
      ansible.builtin.shell: |
        mysql -e "DROP DATABASE IF EXISTS zabbix; CREATE DATABASE zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
      changed_when: true
      no_log: true
      when: db_version.stdout | trim != '7040000'

    - name: check if zabbix schema is imported
      ansible.builtin.shell: |
        mysql -uzabbix -p'{{ zabbix_db_password }}' -N -B \
          -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='zabbix' AND table_name='dbversion';"
      register: schema_check
      changed_when: false
      no_log: true

    - name: find zabbix mysql schema file
      ansible.builtin.find:
        paths: /usr/share
        patterns: "server.sql.gz"
        recurse: yes
      register: zabbix_sql_script
      when: schema_check.stdout | trim != '1'

    - name: set schema file path
      ansible.builtin.set_fact:
        zabbix_schema_file: "{{ zabbix_sql_script.files | map(attribute='path') | select('search', '/mysql/') | list | first }}"
      when: schema_check.stdout | trim != '1'

    - name: import zabbix schema
      ansible.builtin.shell: |
        set -o pipefail
        zcat "{{ zabbix_schema_file }}" | \
        mysql --default-character-set=utf8mb4 -uzabbix -p'{{ zabbix_db_password }}' zabbix
      args:
        executable: /bin/bash
      when: schema_check.stdout | trim != '1'

    - name: create tls directory
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        owner: zabbix
        group: zabbix
        mode: "0750"

    - name: check if CA certificate already exists
      ansible.builtin.stat:
        path: "{{ tls_dir }}/ca.crt"
      register: ca_cert_stat

    - name: generate CA private key
      ansible.builtin.command:
        cmd: openssl genrsa -out "{{ tls_dir }}/ca.key" 4096
        creates: "{{ tls_dir }}/ca.key"
      when: not ca_cert_stat.stat.exists

    - name: generate CA certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -new -nodes
          -key "{{ tls_dir }}/ca.key"
          -sha256 -days {{ tls_cert_days }}
          -out "{{ tls_dir }}/ca.crt"
          -subj "{{ tls_ca_subject }}"
        creates: "{{ tls_dir }}/ca.crt"

    - name: generate server private key
      ansible.builtin.command:
        cmd: openssl genrsa -out "{{ tls_dir }}/server.key" 4096
        creates: "{{ tls_dir }}/server.key"

    - name: generate server CSR
      ansible.builtin.command:
        cmd: >-
          openssl req -new
          -key "{{ tls_dir }}/server.key"
          -out "{{ tls_dir }}/server.csr"
          -subj "{{ tls_server_subject }}"
        creates: "{{ tls_dir }}/server.csr"

    - name: sign server certificate with CA
      ansible.builtin.command:
        cmd: >-
          openssl x509 -req
          -in "{{ tls_dir }}/server.csr"
          -CA "{{ tls_dir }}/ca.crt"
          -CAkey "{{ tls_dir }}/ca.key"
          -CAcreateserial
          -out "{{ tls_dir }}/server.crt"
          -days {{ tls_cert_days }}
          -sha256
        creates: "{{ tls_dir }}/server.crt"

    - name: set permissions on private keys
      ansible.builtin.file:
        path: "{{ item }}"
        owner: zabbix
        group: zabbix
        mode: "0600"
      loop:
        - "{{ tls_dir }}/ca.key"
        - "{{ tls_dir }}/server.key"
        - "{{ tls_dir }}/agent.key"

    - name: set permissions on certificates
      ansible.builtin.file:
        path: "{{ item }}"
        owner: zabbix
        group: zabbix
        mode: "0644"
      loop:
        - "{{ tls_dir }}/ca.crt"
        - "{{ tls_dir }}/server.crt"
        - "{{ tls_dir }}/agent.crt"
        
    - name: generate agent private key
      ansible.builtin.command:
        cmd: openssl genrsa -out "{{ tls_dir }}/agent.key" 4096
        creates: "{{ tls_dir }}/agent.key"

    - name: generate agent CSR
      ansible.builtin.command:
        cmd: >-
          openssl req -new
          -key "{{ tls_dir }}/agent.key"
          -out "{{ tls_dir }}/agent.csr"
          -subj "{{ tls_agent_subject }}"
        creates: "{{ tls_dir }}/agent.csr"
  
    - name: sign agent certificate with CA
      ansible.builtin.command:
        cmd: >-
          openssl x509 -req
          -in "{{ tls_dir }}/agent.csr"
          -CA "{{ tls_dir }}/ca.crt"
          -CAkey "{{ tls_dir }}/ca.key"
          -CAcreateserial
          -out "{{ tls_dir }}/agent.crt"
          -days {{ tls_cert_days }}
          -sha256
        creates: "{{ tls_dir }}/agent.crt"

    - name: preseed zabbix frontend config
      ansible.builtin.copy:
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          $DB['TYPE']     = 'MYSQL';
          $DB['SERVER']   = 'localhost';
          $DB['PORT']     = '0';
          $DB['DATABASE'] = 'zabbix';
          $DB['USER']     = 'zabbix';
          $DB['PASSWORD'] = '{{ zabbix_db_password }}';
          $DB['SCHEMA']   = '';
          $DB['ENCRYPTION'] = false;
          $DB['KEY_FILE'] = '';
          $DB['CERT_FILE'] = '';
          $DB['CA_FILE'] = '';
          $DB['VERIFY_HOST'] = false;
          $DB['CIPHER_LIST'] = '';
          $ZBX_SERVER      = 'localhost';
          $ZBX_SERVER_PORT = '10051';
          $ZBX_SERVER_NAME = '';
          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      no_log: true

    - name: point apache to new frontend path 
      ansible.builtin.shell: |
        CONF=/etc/apache2/conf-available/zabbix.conf
        if grep -qP '/usr/share/zabbix(?!/ui)' "$CONF"; then
          sed -i -e 's|/usr/share/zabbix/ui|/usr/share/zabbix|g' \
                 -e 's|/usr/share/zabbix|/usr/share/zabbix/ui|g' "$CONF"
          echo changed
        fi
      register: apache_path_update
      changed_when: "'changed' in apache_path_update.stdout"
      notify: restart apache2

    - name: fail2ban config
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          backend = auto
          banaction = iptables-multiport
          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          backend = polling
          maxretry = 5
          bantime = 1h
          findtime = 10m
      notify: restart f2b

    - name: set zabbix DBName
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBName='
        line: 'DBName=zabbix'

    - name: set zabbix DBUser
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBUser='
        line: 'DBUser=zabbix'

    - name: set zabbix DBPassword
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: 'DBPassword={{ zabbix_db_password }}'

    - name: configure zabbix server TLS settings
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: 'TLSAccept', value: 'cert' }
        - { key: 'TLSCAFile', value: '{{ tls_dir }}/ca.crt' }
        - { key: 'TLSCertFile', value: '{{ tls_dir }}/server.crt' }
        - { key: 'TLSKeyFile', value: '{{ tls_dir }}/server.key' }
      notify: restart zabbix-server

    - name: zabbix agent config with TLS certificates
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop:
        - { key: 'Server', value: '{{ zabbix_server_ip | default("127.0.0.1") }}' }
        - { key: 'ServerActive', value: '{{ zabbix_server_ip | default("127.0.0.1") }}' }
        - { key: 'Hostname', value: '{{ ansible_facts["hostname"] }}' }
        - { key: 'HostMetadataItem', value: 'system.uname' }
        - { key: 'HostMetadata', value: 'ubuntu_zabbix_agent' }
        - { key: 'RefreshActiveChecks', value: '120' }
        - { key: 'BufferSend', value: '5' }
        - { key: 'BufferSize', value: '100' }
        - { key: 'TLSConnect', value: 'cert' }
        - { key: 'TLSAccept', value: 'cert' }
        - { key: 'TLSCAFile', value: '{{ tls_dir }}/ca.crt' }
        - { key: 'TLSCertFile', value: '{{ tls_dir }}/agent.crt' }
        - { key: 'TLSKeyFile', value: '{{ tls_dir }}/agent.key' }
      notify: restart zabbix-agent

    - name: start and verify services
      block:
        - name: start zabbix-server
          ansible.builtin.service:
            name: zabbix-server
            state: started
            enabled: true

        - name: start other services
          ansible.builtin.service:
            name: "{{ item }}"
            state: started
            enabled: true
          loop: [zabbix-agent, apache2, fail2ban]

        - name: wait for zabbix-server to become active
          ansible.builtin.command: systemctl is-active zabbix-server
          register: zbx_status
          changed_when: false
          until: zbx_status.stdout == 'active'
          retries: 12
          delay: 10
      rescue:
        - name: dump journalctl and zabbix log
          ansible.builtin.shell: |
            echo "JOURNALCTL"
            journalctl -u zabbix-server -n 30 --no-pager 2>&1
            echo "ZABBIX LOG"
            tail -n 50 /var/log/zabbix/zabbix_server.log 2>&1
          register: zbx_debug_log
          changed_when: false
          failed_when: false

  handlers:
    - name: restart f2b
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: restart zabbix-server
      ansible.builtin.service:
        name: zabbix-server
        state: restarted

    - name: restart zabbix-agent
      ansible.builtin.service:
        name: zabbix-agent
        state: restarted

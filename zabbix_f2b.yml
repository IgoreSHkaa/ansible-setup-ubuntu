---
- name: zabbix server + agent + fail2ban
  hosts: all
  become: true

  vars:
    psk_id: "zabbixPSK"

  tasks:
    - name: add zabbix repo
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/7.4/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.4+ubuntu24.04_all.deb

    - name: install all packages
      ansible.builtin.apt:
        name:
          - mariadb-server
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent
          - fail2ban
        update_cache: true

    - name: start mariadb
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: create zabbix db and db_user
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
      changed_when: false
      no_log: true

    - name: check if zabbix schema is imported
      ansible.builtin.shell: |
        mysql -uzabbix -p{{ zabbix_db_password }} -e "SHOW TABLES FROM zabbix;" | grep -q users
      register: schema_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: import zabbix schema
      ansible.builtin.shell: |
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | \
        mysql --default-character-set=utf8mb4 -uzabbix -p{{ zabbix_db_password }} zabbix
      when: schema_check.rc != 0
      no_log: true

    - name: preseed zabbix frontend config
      ansible.builtin.copy:
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          // Zabbix GUI configuration file.
          $DB['TYPE']     = 'MYSQL';
          $DB['SERVER']   = 'localhost';
          $DB['PORT']     = '0';
          $DB['DATABASE'] = 'zabbix';
          $DB['USER']     = 'zabbix';
          $DB['PASSWORD'] = '{{ zabbix_db_password }}';
          $DB['SCHEMA']   = '';
          $DB['ENCRYPTION'] = false;
          $DB['KEY_FILE'] = '';
          $DB['CERT_FILE'] = '';
          $DB['CA_FILE'] = '';
          $DB['VERIFY_HOST'] = false;
          $DB['CIPHER_LIST'] = '';

          $ZBX_SERVER      = 'localhost';
          $ZBX_SERVER_PORT = '10051';
          $ZBX_SERVER_NAME = '';

          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
      no_log: true

    - name: update apache zabbix config for new frontend path
      ansible.builtin.shell: |
        if grep -q '/usr/share/zabbix"' /etc/apache2/conf-available/zabbix.conf; then
          sed -i 's:/usr/share/zabbix":/usr/share/zabbix/ui":g' /etc/apache2/conf-available/zabbix.conf
          echo "changed"
        fi
      register: apache_path_update
      changed_when: "'changed' in apache_path_update.stdout"
      notify: restart apache2
          
    - name: fail2ban config
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          backend = auto
          banaction = iptables-multiport

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          backend = polling
          maxretry = 5
          bantime = 1h
          findtime = 10m
      notify: restart f2b

    - name: psk file
      ansible.builtin.copy:
        dest: /etc/zabbix/agent.psk
        content: "{{ psk_key }}"
        owner: zabbix
        group: zabbix
        mode: "0600"

    - name: set zabbix DBName
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBName='
        line: 'DBName=zabbix'
      notify: restart zabbix-server

    - name: set zabbix DBUser
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBUser='
        line: 'DBUser=zabbix'
      notify: restart zabbix-server

    - name: set zabbix DBPassword
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^#?\s*DBPassword='
        line: 'DBPassword={{ zabbix_db_password }}'
      no_log: true
      notify: restart zabbix-server

    - name: check zabbix server TLS support
      ansible.builtin.command: /usr/sbin/zabbix_server --help
      register: zabbix_help
      changed_when: false
      check_mode: false

    - name: set fact for TLS support
      ansible.builtin.set_fact:
        zabbix_tls_supported: "{{ 'TLSAccept' in zabbix_help.stdout }}"

    - name: zabbix server tls config 
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_server.d/tls.conf
        content: |
          TLSAccept=psk
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
        owner: root
        group: zabbix
        mode: "0640"
      notify: restart zabbix-server
      when: zabbix_tls_supported | bool

    - name: zabbix agent config
      ansible.builtin.blockinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        block: |
          Server=127.0.0.1
          ServerActive=127.0.0.1
          Hostname={{ ansible_facts['hostname'] }}
          TLSConnect=psk
          TLSAccept=psk
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
      notify: restart zabbix-agent
      when: zabbix_tls_supported | bool

    - name: zabbix agent without tls config
      ansible.builtin.blockinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        block: |
          Server=127.0.0.1
          ServerActive=127.0.0.1
          Hostname={{ ansible_facts['hostname'] }}
          TLSConnect=unencrypted
          TLSAccept=unencrypted
      notify: restart zabbix-agent
      when: not zabbix_tls_supported | bool

    - name: start services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [zabbix-server, zabbix-agent, apache2, fail2ban]

  handlers:
    - name: restart f2b
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: restart apache2
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: restart zabbix-server
      ansible.builtin.service:
        name: zabbix-server
        state: restarted

    - name: restart zabbix-agent
      ansible.builtin.service:
        name: zabbix-agent
        state: restarted

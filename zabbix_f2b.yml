---
- name: zabbix server + agent2 + fail2ban
  hosts: all
  become: true

  vars:
    psk_id: "zabbixPSK"

  tasks:
    - name: add zabbix repo
      ansible.builtin.apt:
        deb: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb

    - name: install all packages
      ansible.builtin.apt:
        name:
          - mariadb-server
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-agent2
          - fail2ban
        update_cache: true

    - name: start mariadb
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: create zabbix db and db_user
      ansible.builtin.shell: |
        mysql -e "CREATE DATABASE IF NOT EXISTS zabbix CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
        mysql -e "CREATE USER IF NOT EXISTS 'zabbix'@'localhost' IDENTIFIED BY '{{ zabbix_db_password }}';"
        mysql -e "GRANT ALL ON zabbix.* TO 'zabbix'@'localhost'; FLUSH PRIVILEGES;"
      changed_when: false
      no_log: true

    - name: check if zabbix schema is imported
      ansible.builtin.shell: |
        mysql -uzabbix -p{{ zabbix_db_password }} -e "SHOW TABLES FROM zabbix;" | grep -q users
      register: schema_check
      failed_when: false
      changed_when: false
      no_log: true

    - name: import zabbix schema
      ansible.builtin.shell: |
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | \
        mysql --default-character-set=utf8mb4 -uzabbix -p{{ zabbix_db_password }} zabbix
      when: schema_check.rc != 0
      no_log: true

    - name: fail2ban config
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          backend = auto
          banaction = iptables-multiport

          [sshd]
          enabled = true
          port = ssh
          filter = sshd
          logpath = /var/log/auth.log
          backend = polling
          maxretry = 5
          bantime = 1h
          findtime = 10m
      notify: restart f2b

    - name: psk file 
      ansible.builtin.copy:
        dest: /etc/zabbix/agent.psk
        content: "{{ psk_key }}"
        owner: zabbix
        group: zabbix
        mode: "0600"

    - name: clean old ansible blocks from server config
      ansible.builtin.shell: |
        sed -i '/# BEGIN ANSIBLE MANAGED BLOCK/,/# END ANSIBLE MANAGED BLOCK/d' /etc/zabbix/zabbix_server.conf
      changed_when: false

    - name: zabbix server config 
      ansible.builtin.blockinfile:
        path: /etc/zabbix/zabbix_server.conf
        block: |
          DBName=zabbix
          DBUser=zabbix
          DBPassword={{ zabbix_db_password }}
      no_log: true
      notify: restart zabbix-server

 - name: zabbix server tls config (in dedicated file)
      ansible.builtin.copy:
        dest: /etc/zabbix/zabbix_server.d/tls.conf
        content: |
          TLSAccept=psk
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
        owner: root
        group: zabbix
        mode: "0640"
      notify: restart zabbix-server

    - name: zabbix agent2 config
      ansible.builtin.blockinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        block: |
          Server=127.0.0.1
          ServerActive=127.0.0.1
          Hostname={{ ansible_hostname }}
          TLSConnect=psk
          TLSAccept=psk
          TLSPSKIdentity={{ psk_id }}
          TLSPSKFile=/etc/zabbix/agent.psk
      notify: restart zabbix-agent2

    - name: start services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [zabbix-server, zabbix-agent2, apache2, fail2ban]

  handlers:
    - name: restart f2b
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: restart zabbix-server
      ansible.builtin.shell: |
        sleep 30 && systemctl restart zabbix-server
      listen: restart zabbix-server

    - name: restart zabbix-agent2
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
